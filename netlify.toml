[[redirects]]
from = "https://mark1.netlify.app/"
to = "https://andreasmaerki.dev/"
status = 301
force = true

[[redirects]]
from = "https://mark1.netlify.app/*"
to = "https://andreasmaerki.dev/:splat"
status = 301
force = true

# SPA fallback for React Router
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
publish = "build"

# Don't cache the main HTML file (first rule wins, so it must come before /assets/*)
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets never change - cache for a year
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
